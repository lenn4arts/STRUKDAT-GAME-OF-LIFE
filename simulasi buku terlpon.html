<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Simulasi Buku Telepon</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }

        h1 {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
        }

        .container {
            width: 80%;
            margin: auto;
            margin-top: 20px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #2980b9;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
        }

        th {
            background-color: #3498db;
            color: white;
        }

        .delete-btn {
            background-color: red;
        }
    </style>
</head>
<body>

<h1>Simulasi Buku Telepon</h1>

<div class="container">

    <h3>Tambah Kontak</h3>
    <input type="text" id="nama" placeholder="Nama">
    <input type="text" id="nomor" placeholder="Nomor Telepon">
    <button onclick="tambahKontak()">Tambah</button>

    <h3>Cari Kontak</h3>
    <input type="text" id="cari" placeholder="Masukkan Nama">
    <button onclick="cariKontak()">Cari</button>

    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Nama</th>
                <th>Nomor Telepon</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="tabelKontak">
        </tbody>
    </table>

</div>

<script>
    let bukuTelepon = [];

    function tampilkanKontak(data = bukuTelepon) {
        let tabel = document.getElementById("tabelKontak");
        tabel.innerHTML = "";

        data.forEach((kontak, index) => {
            tabel.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${kontak.nama}</td>
                    <td>${kontak.nomor}</td>
                    <td>
                        <button class="delete-btn" onclick="hapusKontak(${index})">Hapus</button>
                    </td>
                </tr>
            `;
        });
    }

    function tambahKontak() {
        let nama = document.getElementById("nama").value;
        let nomor = document.getElementById("nomor").value;

        if (nama === "" || nomor === "") {
            alert("Nama dan Nomor harus diisi!");
            return;
        }

        bukuTelepon.push({ nama, nomor });
        tampilkanKontak();

        document.getElementById("nama").value = "";
        document.getElementById("nomor").value = "";
    }

    function hapusKontak(index) {
        bukuTelepon.splice(index, 1);
        tampilkanKontak();
    }

    function cariKontak() {
        let keyword = document.getElementById("cari").value.toLowerCase();
        let hasil = bukuTelepon.filter(k =>
            k.nama.toLowerCase().includes(keyword)
        );
        tampilkanKontak(hasil);
    }
</script>

</body>
</html>
